name: Aplicar prova (pasta do ano publicada no template)

# Roda em 4 gatilhos para nao depender de um so:
#  - schedule: polling a cada 10 min (minutos :07, :17, ...) — backstop caso o
#    disparo imediato falhe. ATENCAO: schedules desativam apos 60 dias sem
#    atividade no repo — por isso os demais gatilhos.
#  - push: commit normal do aluno; o push do BOT que grava .prova/track NAO
#    dispara workflow (GITHUB_TOKEN nao dispara workflows — anti-recursao),
#    por isso o comentario /track abaixo e o disparo real da aplicacao.
#  - issue_comment: "/track <nome>" (selecao — aplica na hora, sem esperar o
#    commit do bot) ou "aplicar" (forcar manual).
#  - workflow_dispatch: gatilho manual.

on:
  schedule:
    - cron: "7-57/10 * * * *"
  push:
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  # overlay nunca e interrompido: eventos em fila (cancel-in-progress: false)
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  REPO_SLUG: ${{ github.event.repository.name }}
  REPO_FULL: ${{ github.repository }}
  TEMPLATE_URL: ${{ vars.TEMPLATE_URL || 'https://github.com/endersonmenezes/exam-escola-ti.git' }}
  ISSUE_COMMENT_BODY: ${{ github.event.comment.body }}

jobs:
  aplicar:
    name: Descobrir pasta do ano, aplicar e comentar na issue
    # no-op no repositorio-template; em issue_comment: sobe para "/track <nome>"
    # (o proprio script valida o nome), "/aplicar" ou "aplicar" solto. Comentarios
    # "/auto-correcao" e demais NAO disparam a aplicacao.
    if: github.repository != 'endersonmenezes/exam-escola-ti' && (github.event_name != 'issue_comment' || contains(github.event.comment.body, '/track ') || contains(github.event.comment.body, '/aplicar') || contains(github.event.comment.body, 'aplicar'))
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: aplicar pasta do ano (idempotente)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/aplicar_prova.py
